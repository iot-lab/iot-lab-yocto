#@TYPE: Machine
#@NAME: var-som-am35

#@DESCRIPTION: Machine configuration for var-som-am35 systems

DEFAULTTUNE ?= "cortexa8hf-neon"
SOC_FAMILY = "omap3"
require conf/machine/include/soc-family.inc
require conf/machine/include/arm/armv7a/tune-cortexa8.inc

SERIAL_CONSOLES = "115200;ttyO2"
USE_VT = "2"

# kernel
PREFERRED_PROVIDER_virtual/kernel ?= "linux-var-som-am35"
KERNEL_IMAGETYPE = "zImage"
KERNEL_EXTRA_ARGS = "LOADADDR=0x80008000"
# deployed as ${MACHINE}.dtb, appended to the uImage by the kernel recipe
KERNEL_DEVICETREE ?= "ti/omap/var-som-am35.dtb"

# u-boot
# The bootloader stays in the board NAND and is not rebuilt, only the U-Boot
# environment tools (libubootenv, fw_printenv/fw_setenv) are installed.

## ----------------------------------------
## image formats and filesystems
## ----------------------------------------

IMAGE_FSTYPES += "tar.gz"
