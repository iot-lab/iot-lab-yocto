#@--------------------------------------------------------------------
#@TYPE: Distribution
#@NAME: IoT-LAB Linux  <http://www.iot-lab.info/>
#@--------------------------------------------------------------------

require conf/distro/poky.conf      

DISTRO          = "iotlab"
DISTRO_NAME     = "IoT-LAB Linux"
DISTRO_VERSION  = "2020-devel"
DISTRO_REVISION = "1"
DISTRO_PR       = ".1"
DISTRO_TYPE     = "dev"

DEFAULT_TIMEZONE ?= "Europe/Paris"

# Remove ptest globally: iotlab-image.inc's own removal only applies to the
# image recipe itself, not to every other recipe's parse (e.g. gawk, m4,
# bash), which still build -ptest packages and fail QA otherwise.
DISTRO_FEATURES:remove = "ptest"

# Gateways are headless, SSH-only, no display: drop the graphics-related
# DISTRO_FEATURES so recipes with optional PACKAGECONFIGs gated on them
# (e.g. avahi's gtk3 support) don't needlessly pull in the graphics stack
# (gtk+3, cairo, pango, gdk-pixbuf, mesa, wayland-protocols, vulkan-loader...).
DISTRO_FEATURES:remove = "opengl wayland vulkan x11"
